name: Update menus and deploy

on:
  schedule:
    - cron: "0 4,7,9 * * *"   # UTC: early morning, before & around lunch
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data && python scripts/fetch.py
      - run: mkdir -p _site/data && cp index.html _site/ && cp data/menu.json _site/data/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
