name: Update menus and deploy

on:
  schedule:
    # GitHub cron is UTC-only: fire at both possible UTC hours, the gate below
    # keeps only the runs at 06:00, 09:00 and 11:00 Zurich time (CET or CEST).
    - cron: "0 4,5,7,8,9,10 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          h=$(TZ=Europe/Zurich date +%H)
          if [ "${{ github.event_name }}" != schedule ] || [[ "$h" =~ ^(06|09|11)$ ]]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo "Zurich hour $h, skipping"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data && python scripts/fetch.py
      - run: mkdir -p _site/data && cp index.html _site/ && cp data/menu.json _site/data/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
