name: Update menus and deploy

on:
  # Scheduled runs are triggered externally by cron-job.org (GitHub's cron is unreliable)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs: with both in one job, deploy-pages
  # sometimes queried the artifact before GitHub listed it ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data && python scripts/fetch.py
      - run: mkdir -p _site/data && cp index.html _site/ && cp data/menu.json _site/data/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
