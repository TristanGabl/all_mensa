name: Update menus and deploy

on:
  schedule:
    # UTC (Zurich CEST -2h): 8:43-12:43 hourly, 15:17
    - cron: "43 6-10 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: mkdir -p data && python scripts/fetch.py
      - run: mkdir -p _site/data && cp index.html _site/ && cp data/menu.json _site/data/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
